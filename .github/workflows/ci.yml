name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/sboardnode
      - run: sh -n install.sh scripts/acceptance-alpine.sh scripts/fixtures/init-stub scripts/fixtures/xray-openrc
